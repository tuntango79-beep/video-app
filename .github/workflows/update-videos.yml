name: Update videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch myUpload list and rebuild videos.js
        env:
          MYUPLOAD_EMAIL: ${{ secrets.MYUPLOAD_EMAIL }}
          MYUPLOAD_PASSWORD: ${{ secrets.MYUPLOAD_PASSWORD }}
        run: python3 tools/update_videos.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update video list"
            git push
          fi
